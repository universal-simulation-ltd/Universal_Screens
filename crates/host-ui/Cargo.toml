[package]
name = "extender-host-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
extender-protocol.workspace = true
# `nearby_orbit` renders discovered peers; DiscoveredPeer is this crate's type,
# which both hosts merely re-export through their own `discovery` module.
extender-discovery.workspace = true
# egui types (Ui, Color32, Context). Comes via eframe so the version matches the
# hosts' exactly — a mismatched egui here would not unify and the types would
# silently stop being the same types.
eframe = { version = "0.29", features = ["persistence"] }
# The pairing PIN is the Noise pre-shared key, so it comes from the OS RNG — see
# `gen_pin`. Already in the lockfile via extender-transport.
getrandom = "0.2"
# The live user count (user_count.rs) — the hosts' ONE call to a UNI·SIM
# server. ureq is blocking and tiny, which suits a 45-second beat on its own
# thread; rustls is already in the tree via extender-transport.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Where the install id is kept, per OS.
dirs = "5"

