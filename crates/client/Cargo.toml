[package]
name = "extender-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
extender-core.workspace = true
extender-protocol.workspace = true
openh264 = "0.9"
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"
# The "Press Esc to exit full screen" reminder (hint.rs): a glyph rasteriser and
# the font the host window already uses. Both are in the tree via egui.
ab_glyph = "0.2.32"
epaint_default_fonts = "0.29.1"

# Keep this screen awake while it shows another computer (keep_awake.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
