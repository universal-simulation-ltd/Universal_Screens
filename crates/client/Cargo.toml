[package]
name = "extender-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
extender-core.workspace = true
extender-protocol.workspace = true
openh264 = "0.9"
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.13"

# Keep this screen awake while it shows another computer (keep_awake.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
