[package]
name = "extender-host-linux"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "extender-host-linux"
path = "src/main.rs"

[dependencies]
extender-protocol.workspace = true
# Transport encryption: auto-detect an encrypted native client vs a legacy/loopback
# plaintext peer per connection, running the Noise responder handshake keyed by the
# host's pairing PIN. Same crate the Windows and macOS hosts use.
extender-transport.workspace = true
# Shared LAN peer discovery (UDP multicast beacon/listener + mDNS), wrapped by the
# same thin egui adapter the other two hosts use.
extender-discovery.workspace = true
serde = { version = "1", features = ["derive"] }
# QR rendering + logo compositing (the connect / get-the-app codes).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Host control window (GUI mode). "persistence" saves preferences across launches.
eframe = { version = "0.29", features = ["persistence"] }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os="linux")'.dependencies]
# Input injection through the kernel's uinput device. Deliberately NOT the XDG
# RemoteDesktop portal or XTEST: uinput is one implementation that works under
# X11 *and* every Wayland compositor, with no portal consent dialog and no
# display-server detection. See docs/LINUX-HOST.md §3. Pure Rust — no C deps.
evdev = "0.13"
# X11 screen capture and the EWMH window picker (Stage 2 of docs/LINUX-HOST.md).
# x11rb speaks the X protocol over the socket itself, so NOTHING is linked: no
# libX11, no libxcb, and so nothing for an AppImage to fail to find. `shm` adds
# the MIT-SHM requests, which measured 11x faster than GetImage (0.93 ms vs
# 10.7 ms at 1920x1080) — and notably does NOT require `allow-unsafe-code`,
# which is the feature that would have pulled in `as-raw-xcb-connection` and put
# libxcb back on the link line.
# `randr` is the second screen (src/vdisplay.rs): RRSetScreenSize to grow the
# root framebuffer and RRSetMonitor to declare the new area a display. Like
# `shm`, it is protocol only — no libXrandr, nothing added to the link line.
x11rb = { version = "0.13", features = ["shm", "randr"] }
# Only for the SysV shared-memory calls MIT-SHM needs (shmget/shmat/shmdt);
# already in the tree beneath evdev.
libc = "0.2"
# Mirror / remote-control: H.264-encode the captured screen (software; builds
# openh264 from source via openh264-sys2, so a Linux build machine needs
# `build-essential` + `nasm` — see docs/LINUX-HOST.md §1). Nothing is linked
# dynamically, so the AppImage gains no new runtime dependency.
openh264 = "0.9"
# The wire framing (Annex-B → raw parameter sets + AVCC frame data) and the
# encode-size maths, shared with the Windows host rather than forked: the format
# is the *client's* contract, so two copies would mean two answers.
extender-h264.workspace = true

