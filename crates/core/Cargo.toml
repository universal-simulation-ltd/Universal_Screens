[package]
name = "extender-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
extender-protocol.workspace = true
# Transport encryption and pairing: SPAKE2 over the code, then a Noise tunnel,
# before the ClientHello. The `postcard` framing runs on top unchanged.
extender-transport.workspace = true

# Where a desktop client keeps its pairing keys (the per-user config folder).
# Not on iOS/Android: iOS uses the app's own Library, and Android is told by
# the app (`set_pairing_location`), since the Rust side cannot know its folder.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
dirs = "5"
