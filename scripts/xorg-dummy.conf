# A real X server with no hardware, for the second-screen tests.
#
# ⚠️ Xvfb is NOT enough for these, and the reason is not obvious: its RandR
# screen-size range reports maximum == current, so `RRSetScreenSize` is refused
# and the desktop can never grow. Every other X11 test in this crate is happy on
# Xvfb — capture, the window picker, the mirror — because none of them resizes
# anything. `crates/host-linux/src/vdisplay.rs` does nothing else.
#
# The `dummy` driver is a real Xorg DDX with a real RandR implementation: it
# reports `minimum 64 x 64 ... maximum 32767 x 32767`, resizes on request, and
# even offers spare outputs (DUMMY0..DUMMY15). Measured, not assumed.

Section "Device"
    Identifier  "dummy-device"
    Driver      "dummy"
    # ⚠️ Must cover the Virtual size below at 4 bytes per pixel, or Xorg exits
    # with "Virtual size exceeds video memory" and "no screens found" — which
    # reads like a driver that is not installed rather than a number that is
    # too small. 4096 x 4096 x 4 = 64 MB.
    VideoRam    262144
EndSection

Section "Monitor"
    Identifier  "dummy-monitor"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 200.0
EndSection

Section "Screen"
    Identifier  "dummy-screen"
    Device      "dummy-device"
    Monitor     "dummy-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1280x800"
        # The headroom the second screen grows into. A phone-sized client on a
        # 1280-wide desktop needs ~2100; 4096 leaves room for a bigger one.
        Virtual 4096 4096
    EndSubSection
EndSection
