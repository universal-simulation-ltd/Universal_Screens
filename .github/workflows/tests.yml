# Run the tests on every push, rather than only when someone cuts a release.
#
# Until this existed the three workflows in this folder were all **release**
# jobs, triggered by a `v*` tag. So on a repo that ships straight to `main` with
# no PR gate, nothing ran the test suite automatically at all: a break would sit
# on `main` until the next tag, which is the worst moment to discover it.
#
# ⚠️ `cargo test --workspace` FAILS here by design — `host-windows`, `host-macos`
# and `host-linux` each `use` their own platform's API unconditionally, so every
# job must name its packages. See `Docs_UNI_SIM/landmines.md`.
#
# Cheap to delete: it is one file, and nothing else depends on it.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point testing a commit already replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (shared crates, Linux host, browser)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same list as linux-release.yml, and for the same reasons: the GUI links
      # the X11/Wayland client libraries, and `nasm` + a C++ compiler are needed
      # because openh264 is built from source (the mirror, and the desktop
      # client's decoder). `xvfb` is for the capture tests, not the build.
      #
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            build-essential nasm \
            xvfb xauth

      # ⚠️ Node 22+, explicitly. `secure.test.mjs` drives a real WebSocket client
      # and `WebSocket` only became a stable global in Node 22 — on the runner's
      # default it is undefined, and the test fails for a reason that has nothing
      # to do with what it is testing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-linux

      # The platform-agnostic half of the workspace: wire format, transport,
      # client session, discovery, the shared H.264 framing, the browser shim,
      # the WebSocket bridge and the hosts' shared window chrome.
      #
      # ⚠️ `extender-host-ui` MUST stay in this list. Its tests (percent-encoding,
      # room codes, label truncation, and the connect-URL rule that keeps the
      # Wi-Fi password out of the server-visible query) used to live inside
      # `host-windows/src/gui.rs` and ran only on the Windows job. Drop it here
      # and they run nowhere, silently — the crate builds on any platform, so
      # there is no compile error to notice.
      - name: Test the shared crates
        run: |
          cargo test -p extender-protocol -p extender-transport -p extender-core \
                     -p extender-discovery -p extender-h264 -p extender-protocol-wasm \
                     -p extender-web-bridge -p extender-host-ui

      # ⚠️ `xvfb` here, not the whole script: the SECOND SCREEN needs a server
      # whose framebuffer can grow, which neither Xvfb nor this runner's Xorg
      # can — see the `second-screen` job below. The script is shared with the
      # local run (`scripts/docker-test-linux.sh` / `.ps1`) so the two cannot
      # drift into testing different things.
      #
      # ⚠️ It sets `SCREENS_REQUIRE_X11=1`. Without that a missing server makes
      # the capture tests SKIP and the job still reports green — indistinguishable
      # from them passing.
      - name: Test the Linux host (against a live X server)
        run: scripts/test-linux-x11.sh xvfb

      - name: Clippy (the crates this job builds)
        run: |
          cargo clippy -p extender-protocol -p extender-transport -p extender-h264 \
                       -p extender-protocol-wasm -p extender-host-linux \
                       -p extender-host-ui --all-targets

      # The browser's own logic, needing neither a server nor the WASM artifact.
      - name: Test the browser's encryption negotiation
        run: node apps/web/room-caps.test.mjs

      # `rust-cache` caches `~/.cargo/bin`, so this compiles once and is a no-op
      # on every later run — worth the guard, because installing it takes longer
      # than everything else in this job put together.
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - name: Build the WASM shim
        run: |
          rustup target add wasm32-unknown-unknown
          wasm-pack build crates/protocol-wasm --dev --target web \
            --out-dir ../../apps/web/pkg --out-name extender_protocol

      # ⚠️ These load the BUILT artifact, not the Rust source, so the build step
      # above is not optional — a stale `pkg/` would test old bindings and pass.
      - name: Verify the shim against canonical bytes
        run: node apps/web/verify-wasm.mjs

      # The whole chain with the browser code in it: real bridge, real
      # `transport::accept`, real WebSocket, real Noise tunnel.
      - name: Test the encrypted browser leg end to end
        run: node apps/web/secure.test.mjs

  second-screen:
    # ⚠️ **24.04, not 22.04, and the reason is one package version.** The second
    # screen grows the X root framebuffer, so it needs a server that can resize —
    # which Xvfb cannot (its RandR size range reports maximum == current) and
    # which Xorg can only with a driver implementing **RandR 1.2**. Measured on
    # both: `xserver-xorg-video-dummy` is **0.3.8** on Ubuntu 22.04 and has none,
    # so Xorg falls back to emulation (one `default` output, screen pinned at the
    # configured Virtual size); it is **0.4.0** on 24.04 and Debian 12, which
    # offers real `DUMMY0..15` outputs and resizes.
    #
    # A separate job rather than moving the `linux` job to 24.04: that job is
    # pinned to 22.04 to match `linux-release.yml`'s glibc floor, and the point
    # of the pin is that the AppImage runs on older distros.
    name: Linux (the second screen, on a resizable X server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            build-essential nasm \
            x11-utils x11-xserver-utils \
            xserver-xorg-core xserver-xorg-video-dummy

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-second-screen

      # ⚠️ The script checks the server really can resize BEFORE running anything,
      # and fails naming the driver version if it cannot — so a distro bump that
      # takes the capability away is a clear error rather than three tests failing
      # with a message blaming Xvfb.
      - name: Test the second screen
        run: scripts/test-linux-x11.sh xorg

  windows:
    name: Windows (host)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # openh264-sys2 assembles its own source; without NASM the build fails in a
      # C build script whose error never mentions video. Same step as
      # windows-release.yml.
      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-windows

      - name: Test the Windows host
        run: cargo test -p extender-host-windows -p extender-h264 -p extender-transport
