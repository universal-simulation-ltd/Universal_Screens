# Build the Universal Screens macOS app + DMG on a clean runner.
#
# Push a tag (`git tag v0.1.0 && git push --tags`) to cut a release, or run it
# from the Actions tab. Dispatching it against a TAG ref publishes to that tag's
# release, which is how a Mac build gets attached to a tag that was already cut
# for Windows; dispatching against a branch just leaves an artifact.
#
# Why CI and not just a local build: the DMG is the thing strangers double-click,
# so it should come from a machine with nothing on it but the declared toolchain.
# A local build silently inherits whatever is on the dev box.
#
# Developer ID signed and notarised since 0.4.8 (James, 2026-11-18): an ad-hoc
# build lost its Screen Recording / Accessibility grants on every update. The
# certificate and the App Store Connect API key come from repository secrets;
# on a tag the build REFUSES to fall back to ad-hoc (REQUIRE_SIGNING). A
# dispatch against a branch without the secrets still builds, ad-hoc. See
# docs/MACOS-APP.md. Windows is unchanged (unsigned).

name: macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create/update the release on a tag

jobs:
  app:
    # Apple Silicon runner. Both slices are cross-compiled via rustup targets, so
    # the runner's own architecture doesn't decide what ships -- but the ad-hoc
    # signature has to be applied by macOS itself, which is why this cannot be
    # folded into a Linux job.
    #
    # ⚠️ NOT macos-14. The client pulls wgpu -> apple-metal, whose Swift bridge
    # references MTLResidencySet, MTLSamplerReductionMode, MTLSamplerDescriptor
    # .lodBias and MTLFXTemporalScalerDescriptor.requiresSynchronousInitialization
    # -- none of which exist in the SDK on the macos-14 image, so the Swift build
    # fails before any of our own code is compiled. It builds locally only
    # because the dev Mac carries a much newer SDK. Moving this image backwards
    # will break the build again for reasons that look nothing like the cause.
    runs-on: macos-26

    # A step's own `env` is not visible to its `if`, and `secrets` cannot be
    # read there at all, so the "do we have signing material?" flags live here.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # No Pillow and no icon step: the build uses the committed
      # crates/host-macos/assets/AppIcon.icns. make-mac-icns.py redraws artwork
      # superseded in Aug 2026, so running it here reverted the mark on every
      # release — v0.4.3's DMG shipped with the old icon because of it. The mark
      # comes from app-marks/desktop-icons.mjs now — see the banner at the top
      # of scripts/make-mac-icns.py.

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app

      # A throwaway keychain holding only the Developer ID identity, deleted at
      # the end of the job. The .p12 carries just that one certificate + key.
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Write the notary API key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build app + DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: ./scripts/build-app-macos.sh

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: universal-screens-macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          # Adding to a release that already carries the Windows installer, so
          # the existing body must not be clobbered.
          append_body: true
          body: |

            **Universal Screens for macOS.** Download `UniversalScreens-*.dmg`,
            open it, and drag the app to Applications. Universal binary — Apple
            Silicon and Intel. **Requires macOS 12.3 or newer** (ScreenCaptureKit).

            Signed with Universal Simulation Ltd's Developer ID and notarised
            by Apple, so it opens normally. Coming from 0.4.7 or older (signed
            ad-hoc)? macOS sees a new signer once: if a connecting device gets
            a black window or no control, remove Universal Screens from
            Privacy & Security → Screen & System Audio Recording and
            Accessibility, add it back, and restart it. Later updates keep
            the permissions.

            ```bash
            shasum -a 256 UniversalScreens-*.dmg
            ```
