[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/transport",
    "crates/core",
    "crates/h264",
    "crates/discovery",
    "crates/host",
    "crates/host-ui",
    "crates/host-windows",
    "crates/host-macos",
    "crates/host-linux",
    "crates/client",
    "crates/mobile-ffi",
    "crates/android-jni",
    "crates/web-bridge",
    "crates/protocol-wasm",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
extender-protocol = { path = "crates/protocol" }
extender-transport = { path = "crates/transport" }
extender-core = { path = "crates/core" }
# Platform-neutral H.264 wire framing + frame sizing, shared by every mirroring host.
extender-h264 = { path = "crates/h264" }
extender-discovery = { path = "crates/discovery" }
extender-host-ui = { path = "crates/host-ui" }
extender-web-bridge = { path = "crates/web-bridge" }
